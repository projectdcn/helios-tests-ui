- id: TC-IBS-001
  level: L1
  title: Basic crossnode bandwidth test
  category: scale-out-rdma
  suites:
  - mortaro-benic-level1
  - level1
  - mortaro-benic-full
  description: Basic crossnode bandwidth test — the daily-driver smoke test. Runs a single IB verb (ib_write_bw) across all 4 port pairs in parallel,
    using GPU memory over IPv6 in bidirectional mode. Validates that all NIC ports and GPU paths are functional with acceptable bandwidth.
- id: TC-IBS-002
  level: L1
  title: Multi-verb bandwidth sweep
  category: scale-out-rdma
  suites:
  - mortaro-benic-level1
  - level1
  - mortaro-benic-full
  description: Multi-verb bandwidth sweep — runs all 5 BW verbs (write, write_imm, send, send_imm, read) across all 4 port pairs. Validates that
    all RDMA verb types function correctly with GPU memory. This is the standard sanity test.
- id: TC-IBS-005
  level: L1
  title: Single-node loopback bandwidth test
  category: scale-out-rdma
  suites:
  - mortaro-benic-level1
  - level1
  - mortaro-benic-full
  description: Single-node loopback bandwidth test — runs ib_write_bw between port pairs on the same node (P1-P2, P3-P4). Validates internal NIC-to-NIC
    data path and GPU memory access without requiring a second node.
- id: TC-IBS-003
  level: L2
  title: Queue pair scaling test
  category: scale-out-rdma
  suites: []
  description: Queue pair scaling test — sweeps QP counts from 8 to 256 using ib_write_bw with GPU memory. Validates that bandwidth scales or
    remains stable as QP count increases, and that no CQE errors or hangs occur at higher QP counts.
- id: TC-IBS-004
  level: L3
  title: Full parameter matrix regression
  category: scale-out-rdma
  suites: []
  description: 'Full parameter matrix regression — runs all 5 BW verbs across both memory types (CPU + GPU), both address families (IPv4 + IPv6),
    and both directions (unidir + bidir). This is the comprehensive regression test that covers all permutations. Total test count: 5 verbs x
    2 mem x 2 AF x 2 dir x 4 pairs = 320.'
- id: TC-IBS-006
  level: L3
  title: Fully configurable test case
  category: scale-out-rdma
  suites: []
  description: Fully configurable test case — the user specifies any combination of verbs, QP counts, memory type, address family, direction,
    port pairs, and iteration count at runtime. Used for targeted debugging, bisecting failures, and one-off validation runs that don't fit a
    named suite tier.
