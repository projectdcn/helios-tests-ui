# BMC of every switch / compute tray over Redfish, read-only (tests/bmc/test_bmc.py) - added 20 Oct 2026
- id: TC-BMC-001
  level: L1
  title: 'BMC reachable and login works: every switch and compute BMC answers Redfish at its own address (bmc:) with its
    bmc_user and BMC password'
  category: bmc
  origin: added 2026-10-20
- id: TC-BMC-002
  level: L1
  title: 'BMC power state: every system the switch and compute BMCs report is powered on'
  category: bmc
  origin: added 2026-10-20
- id: TC-BMC-003
  level: L1
  title: 'BMC health: no BMC (manager) or system reports health Critical (Warning recorded)'
  category: bmc
  origin: added 2026-10-20
- id: TC-BMC-004
  level: L1
  title: 'BMC sensors: no temperature, fan, voltage or power-supply sensor Critical or beyond its critical limit
    (beyond a non-critical limit recorded)'
  category: bmc
